name: Cập nhật dữ liệu & deploy

on:
  push:
    branches: [main]
  schedule:
    - cron: "0 3 * * *" # 10:00 sáng giờ Việt Nam mỗi ngày
  workflow_dispatch: # cho phép bấm chạy tay trong tab Actions

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Tải dữ liệu Global mới nhất
        run: node scripts/update.mjs

      - name: Lưu dữ liệu mới vào repo (nếu có thay đổi)
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898333+github-actions[bot]@users.noreply.github.com"
          git add site i18n/missing-skills.json
          git diff --cached --quiet || git commit -m "Cập nhật dữ liệu Global $(date -u +%F)"
          git push

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
